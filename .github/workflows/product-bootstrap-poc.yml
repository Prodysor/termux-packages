name: Product bootstrap POC

on:
  push:
    branches:
      - 'product/**'
    paths:
      - '.github/workflows/product-bootstrap-poc.yml'
      - 'scripts/properties.sh'
      - 'scripts/build-bootstraps.sh'
      - 'scripts/bootstrap/**'
      - 'scripts/build/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-bootstrap-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-bootstrap-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out package sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # termux-am is an Android/Gradle package that otherwise appears near the
      # end of the dependency graph. Build it first so SDK incompatibilities
      # fail in minutes instead of after the full native bootstrap build.
      - name: Preflight Android helper package
        env:
          CI: 'true'
          TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder@sha256:374fedda8d2ce7a8ab499735d39329301c4f2f18ea4411b3cf7c93d4668768ab
        run: ./scripts/run-docker.sh ./build-package.sh -a aarch64 termux-am

      - name: Build bootstrap and dependency closure from source
        env:
          CI: 'true'
          TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder@sha256:374fedda8d2ce7a8ab499735d39329301c4f2f18ea4411b3cf7c93d4668768ab
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh env \
            TERMUX_BOOTSTRAP_OUTPUT_DIR=/home/builder/termux-packages/output \
            ./scripts/build-bootstraps.sh --architectures aarch64
          cp output/bootstrap-aarch64.zip bootstrap-aarch64.zip

      - name: Verify product prefix and repository configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap-aarch64.zip
          test -s bootstrap-aarch64.zip
          unzip -tq bootstrap-aarch64.zip
          python3 - bootstrap-aarch64.zip <<'PY'
          import stat
          import sys
          import zipfile

          archive = sys.argv[1]

          def validate_relative_path(path: str, kind: str, allow_dot_prefix: bool = False) -> None:
              if not path or "\\" in path or path.startswith("/"):
                  raise SystemExit(f"Unsafe {kind}: {path!r}")
              if allow_dot_prefix and path.startswith("./"):
                  path = path[2:]
              normalized = path[:-1] if path.endswith("/") else path
              if not normalized or any(part in ("", ".", "..") for part in normalized.split("/")):
                  raise SystemExit(f"Unsafe {kind}: {path!r}")

          with zipfile.ZipFile(archive) as bootstrap:
              names = set()
              symlinks_entries = 0
              for info in bootstrap.infolist():
                  validate_relative_path(info.filename, "ZIP member path")
                  if info.filename in names:
                      raise SystemExit(f"Duplicate ZIP member: {info.filename!r}")
                  names.add(info.filename)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Native symlink entry is forbidden: {info.filename!r}")
                  if info.filename == "SYMLINKS.txt":
                      symlinks_entries += 1

              if symlinks_entries != 1:
                  raise SystemExit(f"Expected one SYMLINKS.txt, found {symlinks_entries}")

              try:
                  symlinks = bootstrap.read("SYMLINKS.txt").decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("SYMLINKS.txt is not valid UTF-8") from error

              entries = 0
              for line_number, line in enumerate(symlinks.splitlines(), 1):
                  parts = line.split("←")
                  if len(parts) != 2 or not parts[0] or not parts[1]:
                      raise SystemExit(f"Malformed SYMLINKS.txt line {line_number}")
                  validate_relative_path(
                      parts[1], f"symlink destination on line {line_number}", allow_dot_prefix=True
                  )
                  entries += 1

              if entries == 0:
                  raise SystemExit("SYMLINKS.txt contains no symlinks")
          PY
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          unzip -q bootstrap-aarch64.zip -d "$scan_dir"
          if grep -R -a -n -F '/data/data/com.termux' "$scan_dir"; then
            echo 'Official Termux prefix remains in the product bootstrap.' >&2
            exit 1
          fi
          expected_prefix='/data/data/com.prodysor.term/files/usr'
          second_stage="$scan_dir/etc/termux/termux-bootstrap/second-stage/termux-bootstrap-second-stage.sh"
          test -f "$second_stage" || {
            echo "Missing second-stage bootstrap script: $second_stage" >&2
            exit 1
          }
          grep -a -q -F "$expected_prefix" "$second_stage" || {
            echo 'Product prefix is missing from the second-stage bootstrap script.' >&2
            exit 1
          }
          grep -a -q -F 'export TERMUX_PACKAGE_ARCH="aarch64"' "$second_stage" || {
            echo 'aarch64 marker is missing from the second-stage bootstrap script.' >&2
            exit 1
          }
          sources="$scan_dir/etc/apt/sources.list"
          test -f "$sources" || {
            echo "Missing APT sources file: $sources" >&2
            exit 1
          }
          mapfile -t enabled_deb_lines < <(
            grep -R -h -E '^[[:space:]]*deb([[:space:]]|$)' "$scan_dir/etc/apt" || true
          )
          if [ "${#enabled_deb_lines[@]}" -ne 1 ]; then
            echo "Expected exactly one enabled APT deb line; found ${#enabled_deb_lines[@]}." >&2
            exit 1
          fi
          if [ -d "$scan_dir/etc/apt/sources.list.d" ] && \
              find "$scan_dir/etc/apt/sources.list.d" -type f \
                \( -name '*.list' -o -name '*.sources' \) -print -quit | grep -q .; then
            echo 'Unexpected additional APT source file found in sources.list.d.' >&2
            exit 1
          fi
          grep -q -F 'https://prodysor.github.io/termux-repo/apt/termux-main/' "$sources" || {
            echo 'Product APT repository is missing from sources.list.' >&2
            exit 1
          }
          grep -q -F "signed-by=$expected_prefix/share/keyrings/prodysor-archive-keyring.gpg" "$sources" || {
            echo 'Product APT signing-key constraint is missing from sources.list.' >&2
            exit 1
          }
          if grep -R -E -q 'packages(-cf)?\.termux\.dev|termux\.net' "$scan_dir/etc/apt"; then
            echo 'Official Termux binary repository remains enabled.' >&2
            exit 1
          fi

      - name: Package POC outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          tar -cf product-poc-debs.tar output/*.deb
          sha256sum bootstrap-aarch64.zip product-poc-debs.tar > product-poc-sha256sums.txt

      - name: Upload non-release POC artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prodysor-bootstrap-poc-aarch64-${{ github.sha }}
          path: |
            bootstrap-aarch64.zip
            product-poc-debs.tar
            product-poc-sha256sums.txt
          if-no-files-found: error
          retention-days: 7
